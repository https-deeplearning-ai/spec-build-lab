<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{% block title %}Jira (simulated){% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='common.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='jira.css') }}">
</head>
<body>
  <div class="topbar">
    <span class="brand">🔷 Jira (simulated)</span>
    <a class="navlink" href="{{ url_for('jira_board') }}">Board</a>
    <div class="spacer"></div>
    <a class="navlink" href="{{ url_for('confluence_list') }}">Switch to Confluence →</a>
  </div>
  <main>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
